<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Minimal Recipe UI — Dark</title>
    <meta
      name="description"
      content="Clean, minimal recipe app UI (HTML + CSS only)"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="content_container" class="wrap">
      <aside class="sidebar">
        <div class="brand" id="brand_id">
          <div class="logo">R</div>
          <div>
            <h2>Recipe</h2>
            <p class="muted">Delicious ideas • Minimal</p>
          </div>
        </div>

        <div class="search">
          <input
            id="user_input"
            aria-label="Search recipes"
            placeholder="Search (eg. pasta, curry, tofu)"
          />
          <button id="search" aria-label="Search">Go</button>
        </div>

        <div class="filters">
          <h4>Categories</h4>
          <div class="chips" id="">
            <div class="chip">All</div>
            <div class="chip">Breakfast</div>
            <div class="chip">pizza</div>
            <div class="chip">pasta</div>
            <div class="chip">tacos</div>
            <div class="chip">Quick</div>
            <div class="chip">Dessert</div>
          </div>
        </div>

        <div class="saved">
          <h4>Saved</h4>
          <p>No saved recipes yet</p>

          <div id="saved-grid" class="saved-grid"></div>
        </div>
      </aside>

      <main class="main">
        <div class="toolbar">
          <div class="title">
            <h1>Popular this week</h1>
            <p class="muted">Hand-picked recipes for your table</p>
          </div>

          <div class="sort">
            <label class="muted" for="sort">theme</label>
            <select id="sort">
              <option value="">select</option>
              <option value="Indian">Indian</option>
              <option value="Italian">Italian</option>
              <option value="Thailand">Thailand</option>
            </select>
          </div>
        </div>

        <div
          id="errormessage"
          class="hidden"
          role="alert"
          aria-live="assertive"
        >
          <span class="icon">⚠️</span>
          <span class="text" id="error_text">----</span>
        </div>
        <section class="grid" id="grid_id">
