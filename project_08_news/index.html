  <head>

    <title>Simple News Aggregator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <h1>📰 News Aggregator</h1>
    <header>
      <input type="text" id="search-input" placeholder="Search news..." />
      <button id="click_it">search</button>
    </header>

    <!-- Category Buttons -->
    <nav id="categories">
      <button class="category" id="technology">Technology</button>
      <button class="category" id="sports">Sports</button>
      <button class="category" id="business">Business</button>
      <button class="category" id="health">Health</button>
      <button class="category" id="science">Science</button>
    </nav>

    <div id="error_div"></div>
    <!-- Container where news cards will load -->
    <main id="news-container">
