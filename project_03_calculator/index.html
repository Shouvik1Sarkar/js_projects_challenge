<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container"></div>
    <div id="parent_container">
      <input type="text" id="display" readonly />
      <div>
        <span id="1">1</span>
        <span id="2">2</span>
        <span id="3">3</span>
        <span id="+">+</span>
      </div>
      <div>
        <span id="4">4</span>
        <span id="5">5</span>
        <span id="6">6</span>
        <span id="-">-</span>
      </div>
      <div>
        <span id="7">7</span>
        <span id="8">8</span>
        <span id="9">9</span>
        <span id="/">÷</span>
      </div>
      <div>
        <span id="%">%</span>
        <span id="0">0</span>
        <span id="=">=</span>
        <span id="*">X</span>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
