<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="parentContainer">
      <div id="gameContainer">
        <h1 id="title">Rock Paper Scissor</h1>
        <div id="hands">
          <span id="user_hand">🙍‍♂️: </span>
          <span id="computer_hand"> :🖥️</span>
        </div>

        <div id="game">
          <span id="rock" class="element">🪨</span>
          <span id="paper" class="element">📃</span>
          <span id="scissor" class="element">✂️</span>
        </div>
      </div>

      <div id="scoreboard">
        <h2 id="points">
          🙍‍♂️: <br />
          🖥️:
        </h2>
        <h2 id="winner">Point: —</h2>
      </div>
    </div>

    <!-- <script src="script.js"></script> -->
    <script src="scripts.js"></script>
  </body>
</html>
